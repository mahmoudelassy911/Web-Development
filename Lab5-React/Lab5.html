<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 5 - Intro to React</title>
  <!-- React, ReactDOM and Babel loaded from the internet (no npm install needed) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #f4f5f7;
  color: #222;
}

.app {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.tab {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccd;
  border-radius: 8px;
  background: white;
  cursor: pointer;
  font-size: 14px;
}
.tab.active {
  background: #1976d2;
  color: white;
  border-color: #1976d2;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
}

h1 {
  margin-top: 0;
  font-size: 24px;
}
h2 {
  font-size: 18px;
  margin: 20px 0 12px;
}
.card > h2:first-child {
  margin-top: 0;
}

.muted {
  color: #888;
}

.row {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Inputs and buttons */
input,
textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font: inherit;
}
textarea {
  min-height: 60px;
  resize: vertical;
}

.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  background: #1976d2;
  color: white;
  cursor: pointer;
  font: inherit;
}
.btn:hover {
  opacity: 0.9;
}
.btn.light {
  background: #e8eaf0;
  color: #333;
}
.btn.danger {
  background: #e53935;
}
.btn.small {
  padding: 4px 10px;
  font-size: 13px;
}

/* Movie form */
.movie-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.movie-form .btn {
  align-self: flex-start;
}

/* Star picker */
.star-picker {
  display: inline-flex;
}
.star {
  background: none;
  border: none;
  font-size: 24px;
  color: #ccc;
  cursor: pointer;
  padding: 0 2px;
}
.star.filled {
  color: #f5b301;
}

/* Movie list */
.movie-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.movie-card {
  border: 1px solid #e3e3e3;
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.movie-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.movie-header h3 {
  margin: 0;
  font-size: 17px;
}
.emojis {
  font-size: 18px;
}
.review p {
  margin: 4px 0 6px;
  font-style: italic;
}
.edit-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* Comments (Task 2) */
.comment-form {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.comment-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.comment {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.avatar {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #1976d2;
  color: white;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bubble {
  background: #f0f0f0;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
}
.bubble p {
  margin: 2px 0 6px;
}
.like {
  border: 1px solid #ccc;
  background: white;
  border-radius: 12px;
  padding: 1px 8px;
  font-size: 12px;
  color: #d32f2f;
  cursor: pointer;
}
.like.liked {
  background: #ffebee;
  border-color: #d32f2f;
}

  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState } = React;

// ---------- Small reusable components ----------

// Clickable stars (1 to 5). Used in the form AND on every movie card.
// Props: rating (number), onChange (function that receives the new rating)
function StarPicker({ rating, onChange }) {
  const stars = [1, 2, 3, 4, 5];

  return (
    <div className="star-picker">
      {stars.map((star) => (
        <button
          key={star}
          type="button"
          className={star <= rating ? "star filled" : "star"}
          onClick={() => onChange(star)}
          title={star + " star(s)"}
        >
          ★
        </button>
      ))}
    </div>
  );
}

// Shows the rating as emojis, e.g. 3 -> ⭐⭐⭐ (3/5)
function StarEmojis({ rating }) {
  if (rating === 0) {
    return <span className="muted">Not rated yet</span>;
  }
  return (
    <span className="emojis">
      {"⭐".repeat(rating)} <span className="muted">({rating}/5)</span>
    </span>
  );
}

// One movie in the list
function MovieCard({ movie, onRemove, onRate, onSaveComment }) {
  const [isEditing, setIsEditing] = useState(false);
  const [draft, setDraft] = useState(movie.comment);

  function handleSave() {
    onSaveComment(movie.id, draft.trim());
    setIsEditing(false);
  }

  return (
    <li className="movie-card">
      <div className="movie-header">
        <h3>{movie.title}</h3>
        <button className="btn danger" onClick={() => onRemove(movie.id)}>
          Remove
        </button>
      </div>

      <StarEmojis rating={movie.rating} />
      <StarPicker
        rating={movie.rating}
        onChange={(newRating) => onRate(movie.id, newRating)}
      />

      {isEditing ? (
        <div className="edit-box">
          <textarea
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            placeholder="Write your review..."
          />
          <div className="row">
            <button className="btn" onClick={handleSave}>
              Save
            </button>
            <button className="btn light" onClick={() => setIsEditing(false)}>
              Cancel
            </button>
          </div>
        </div>
      ) : (
        <div className="review">
          {movie.comment ? (
            <p>“{movie.comment}”</p>
          ) : (
            <p className="muted">No review yet.</p>
          )}
          <button
            className="btn light small"
            onClick={() => {
              setDraft(movie.comment);
              setIsEditing(true);
            }}
          >
            {movie.comment ? "Edit review" : "Add review"}
          </button>
        </div>
      )}
    </li>
  );
}

// ---------- Main component ----------

function MovieWatchList() {
  // The list of movies. Each movie: { id, title, rating, comment }
  const [movies, setMovies] = useState([
    { id: 1, title: "Inception", rating: 5, comment: "Mind-blowing story." },
    { id: 2, title: "The Lion King", rating: 4, comment: "" },
  ]);
  const [nextId, setNextId] = useState(3);

  // Form state
  const [title, setTitle] = useState("");
  const [rating, setRating] = useState(0);
  const [comment, setComment] = useState("");

  function handleAdd(e) {
    e.preventDefault(); // stop the form from reloading the page
    if (title.trim() === "") return;

    const newMovie = {
      id: nextId,
      title: title.trim(),
      rating: rating,
      comment: comment.trim(),
    };
    setMovies([...movies, newMovie]); // make a NEW array, don't change the old one
    setNextId(nextId + 1);

    // clear the form
    setTitle("");
    setRating(0);
    setComment("");
  }

  function handleRemove(id) {
    setMovies(movies.filter((m) => m.id !== id));
  }

  function handleRate(id, newRating) {
    setMovies(movies.map((m) => (m.id === id ? { ...m, rating: newRating } : m)));
  }

  function handleSaveComment(id, newComment) {
    setMovies(movies.map((m) => (m.id === id ? { ...m, comment: newComment } : m)));
  }

  return (
    <div className="card">
      <h1>🎬 My Movies Watch List</h1>

      <form className="movie-form" onSubmit={handleAdd}>
        <input
          type="text"
          placeholder="Movie title"
          value={title}
          onChange={(e) => setTitle(e.target.value)}
        />
        <div className="row">
          <span>Your rating:</span>
          <StarPicker rating={rating} onChange={setRating} />
        </div>
        <textarea
          placeholder="Write a short review (optional)"
          value={comment}
          onChange={(e) => setComment(e.target.value)}
        />
        <button className="btn" type="submit">
          Add movie
        </button>
      </form>

      <h2>Watched ({movies.length})</h2>

      {movies.length === 0 ? (
        <p className="muted">Your list is empty. Add a movie above!</p>
      ) : (
        <ul className="movie-list">
          {movies.map((movie) => (
            <MovieCard
              key={movie.id}
              movie={movie}
              onRemove={handleRemove}
              onRate={handleRate}
              onSaveComment={handleSaveComment}
            />
          ))}
        </ul>
      )}
    </div>
  );
}

// One comment: avatar circle + name + text + like button
function Comment({ comment, onLike }) {
  return (
    <li className="comment">
      <div className="avatar">{comment.name[0].toUpperCase()}</div>
      <div className="bubble">
        <strong>{comment.name}</strong>
        <p>{comment.text}</p>
        <button
          className={comment.liked ? "like liked" : "like"}
          onClick={() => onLike(comment.id)}
        >
          ♥ {comment.likes}
        </button>
      </div>
    </li>
  );
}

function CommentsSection() {
  const [comments, setComments] = useState([
    { id: 1, name: "Sara", text: "Great explanation of components!", likes: 5, liked: false },
    { id: 2, name: "Omar", text: "Props finally make sense to me.", likes: 2, liked: false },
    { id: 3, name: "Ali", text: "Can we do a lab on useState next week?", likes: 7, liked: false },
  ]);
  const [text, setText] = useState("");
  const [nextId, setNextId] = useState(4);

  function handlePost() {
    if (text.trim() === "") return;
    const newComment = { id: nextId, name: "You", text: text.trim(), likes: 0, liked: false };
    setComments([...comments, newComment]);
    setNextId(nextId + 1);
    setText("");
  }

  // Click once to like, click again to unlike
  function handleLike(id) {
    setComments(
      comments.map((c) =>
        c.id === id
          ? { ...c, liked: !c.liked, likes: c.liked ? c.likes - 1 : c.likes + 1 }
          : c
      )
    );
  }

  return (
    <div className="card">
      <h2>Comments ({comments.length})</h2>

      <div className="comment-form">
        <input
          type="text"
          placeholder="Write a comment..."
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") handlePost();
          }}
        />
        <button className="btn" onClick={handlePost}>
          Post
        </button>
      </div>

      <ul className="comment-list">
        {comments.map((c) => (
          <Comment key={c.id} comment={c} onLike={handleLike} />
        ))}
      </ul>
    </div>
  );
}

// App shows one task at a time. The buttons at the top switch between them.
function App() {
  const [page, setPage] = useState("movies");

  return (
    <div className="app">
      <nav className="tabs">
        <button
          className={page === "movies" ? "tab active" : "tab"}
          onClick={() => setPage("movies")}
        >
          Task 1: Movies Watch List
        </button>
        <button
          className={page === "comments" ? "tab active" : "tab"}
          onClick={() => setPage("comments")}
        >
          Task 2: Comments
        </button>
      </nav>

      {/* Conditional rendering: show only the selected task */}
      {page === "movies" ? <MovieWatchList /> : <CommentsSection />}
    </div>
  );
}

// Render the App component inside <div id="root">
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
